# Only two ports are published to your machine: the API (8081) and the RabbitMQ management UI (15673).
# Everything else talks over the compose network, so this will not clash with a RabbitMQ or Redis you
# already run on 5672 / 6379.
#
#   docker compose up -d --build
#   docker compose up -d --scale worker=3     # more workers
name: flashqueue

x-env: &env
  AMQP_URL: amqp://guest:guest@rabbitmq:5672/
  REDIS_ADDR: redis:6379
  WORK_MS: "${WORK_MS:-50}" # how long one order takes to process (stand-in for payment, email, ...)

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15673:15672" # management UI, login guest / guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., args: { CMD: api } }
    ports:
      - "8081:8080"
    environment:
      <<: *env
      STOCK_INIT: "500"
      MAX_QUEUE: "20000" # beyond this many waiting orders the API answers 503 (backpressure)
      SYNC_CONCURRENCY: "8" # capacity of the no-queue path, equal to one worker pool
      ADMIN_KEY: dev-admin # lets the check tool reset between runs; development only
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: ., args: { CMD: worker } }
    environment:
      <<: *env
      WORKERS: "${WORKERS:-8}"
      FAIL_PCT: "${FAIL_PCT:-0}" # percent of attempts that fail on purpose, to exercise retry and the dead-letter queue
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # ---- monitoring: Prometheus scrapes the services, Grafana draws them -------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    depends_on: [api, worker]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # open http://localhost:3001 with no login (local demo only)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/flashqueue.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on: [prometheus]
    restart: unless-stopped

  # ---- load test: only runs when asked (`docker compose run --rm k6`) --------------------------------
  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    command: ["run", "/scripts/burst.js"]
    environment:
      BASE_URL: http://api:8080
      VUS: "${VUS:-200}"
      HOLD: "${HOLD:-30s}"
      STOCK: "${STOCK:-500}"
    volumes:
      - ./loadtest:/scripts:ro
    depends_on: [api]
