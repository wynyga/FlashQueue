# Scrapes every 2 s so a short burst still draws a smooth curve (the default of 15 s would miss most of it).
global:
  scrape_interval: 2s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  # `worker` resolves to every worker container, so `docker compose up --scale worker=3` is picked up
  # automatically within a few seconds, with no config change.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9102
        refresh_interval: 5s
